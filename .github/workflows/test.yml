name: SauceDemo Test Suite

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment to run tests against'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - staging
      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - edge

jobs:
  test:
    name: Run Automation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Install Edge
        uses: browser-actions/setup-edge@v1

      - name: Generate config.properties from secrets
        run: |
          mkdir -p src/main/resources
          echo "qa.url=${{ secrets.QA_URL }}" > src/main/resources/config.properties
          echo "staging.url=${{ secrets.STAGING_URL }}" >> src/main/resources/config.properties
          echo "login.username=${{ secrets.LOGIN_USERNAME }}" >> src/main/resources/config.properties
          echo "login.password=${{ secrets.LOGIN_PASSWORD }}" >> src/main/resources/config.properties
          echo "login.users=${{ secrets.LOGIN_USERS }}" >> src/main/resources/config.properties

      - name: Run tests
        run: |
          mvn clean test \
            -Denv=${{ github.event.inputs.env || 'qa' }} \
            -Dbrowser=${{ github.event.inputs.browser || 'chrome' }} \
            -Dheadless=true

      - name: Upload test reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            screenshots/
          retention-days: 7

      - name: Upload surefire results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-results
          path: target/surefire-reports/
          retention-days: 7
