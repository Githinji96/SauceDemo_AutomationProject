name: SauceDemo Test Suite

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment to run tests against'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - staging

jobs:
  test:
    name: Run Automation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Generate config.properties from secrets
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/config.properties <<EOF
          # Environment URLs
          qa.url=${{ secrets.QA_URL }}
          staging.url=${{ secrets.STAGING_URL }}

          # Credentials
          login.username=${{ secrets.LOGIN_USERNAME }}
          login.password=${{ secrets.LOGIN_PASSWORD }}

          # Multi-user credentials for data provider tests
          login.users=${{ secrets.LOGIN_USERS }}
          EOF

      - name: Run tests
        run: |
          mvn clean test \
            -Denv=${{ github.event.inputs.env || 'qa' }} \
            -Dheadless=true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            screenshots/
          retention-days: 7

      - name: Upload surefire results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-results
          path: target/surefire-reports/
          retention-days: 7
